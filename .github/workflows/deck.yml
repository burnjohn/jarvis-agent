name: Publish deck

# Publishes deck/ (the webinar slides, one static HTML file) to GitHub Pages.
# deck/ is deliberately outside lint, format, typecheck and tests.
on:
  push:
    branches: [main]
    paths: ['deck/**', '.github/workflows/deck.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deck
      - id: deployment
        uses: actions/deploy-pages@v4
