name: Pages

# One GitHub Pages site (ADR-0029):
#   /           deck/ — the webinar slides, one static HTML file (Ukrainian)
#   /en/        deck/en/ — the same slides in English
#   /docs/      docs/ — every Markdown document in docs/, built with VitePress
# deck/ and docs/ are deliberately outside lint, format, typecheck and tests.
on:
  push:
    branches: [main]
    paths: ['deck/**', 'docs/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  pull_request:
    paths: ['deck/**', 'docs/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp deck/index.html _site/
          mkdir -p _site/en
          cp deck/en/index.html _site/en/
          cp -R docs/.vitepress/dist _site/docs
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
